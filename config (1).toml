[theme]
# Primary theme color for the app
primaryColor = "#0066cc"

# Background color for the main content area
backgroundColor = "#ffffff"

# Background color for the sidebar and other secondary areas
secondaryBackgroundColor = "#f8f9fa"

# Text color
textColor = "#262730"

# Font for the app (options: "sans serif", "serif", "monospace")
font = "sans serif"

[server]
# Port for the Streamlit app
port = 8501

# Run in headless mode (no browser auto-opening)
headless = false

# File watcher type
fileWatcherType = "auto"

# Max upload size in MB
maxUploadSize = 200

# Enable CORS
enableCORS = false

# Enable XSRF protection
enableXsrfProtection = true

[browser]
# Automatically open the app in a new browser tab
gatherUsageStats = false
showFirstRunUI = false

[logger]
# Logger level
level = "info"

[client]
# Show error details in the browser
showErrorDetails = true

# Toolbar mode: "auto", "developer", "viewer", "minimal"
toolbarMode = "auto"
